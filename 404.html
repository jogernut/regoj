<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Regoj</title>
    <meta name="description" content="The page you are looking for does not exist.">
    <link rel="icon" type="image/png" href="assets/brand/regoj-icon-512.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--dark);
            color: white;
            text-align: center;
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }
        .error-content {
            position: relative;
            z-index: 10;
            max-width: 520px;
        }
        .error-code {
            font-family: var(--font-heading);
            font-size: clamp(5rem, 12vw, 8rem);
            font-weight: 700;
            line-height: 1;
            margin: 0 0 1rem;
            background: linear-gradient(135deg, #ffffff 30%, var(--brand-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .error-title {
            color: white;
            font-size: 1.8rem;
            margin: 0 0 1rem;
        }
        .error-desc {
            color: var(--muted-light);
            font-size: 1.05rem;
            margin: 0 0 2rem;
        }
    </style>
</head>
<body>
    <div class="error-page">
        <div class="hero__aurora" aria-hidden="true"></div>
        <div class="hero__grid" aria-hidden="true"></div>
        
        <div class="error-content">
            <div class="error-code">404</div>
            <h1 class="error-title">Page not found</h1>
            <p class="error-desc">The page you were looking for doesn't exist or has moved. Return to our homepage to explore our technology services.</p>
            <a href="/" class="btn btn--gradient btn--lg">Back to Regoj Home</a>
        </div>
    </div>
</body>
</html>
